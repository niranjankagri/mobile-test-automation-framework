# Android session, read by DriverFactory.getAndroidInstance()
#
# appium.server.url  = where the Appium server listens
# capability.<name>  = one Appium capability. platformName is sent as is, every other
#                      name gets the W3C "appium:" prefix (automationName -> appium:automationName).
#                      true/false become booleans and whole numbers become numbers
#                      (except platformVersion, which Appium wants as text).
#                      capability.app is a path relative to the project folder.
# Any key can be overridden for one run with -D<key>=<value>,
# e.g. -Dcapability.platformVersion=14

appium.server.url=http://127.0.0.1:4723

capability.platformName=Android
capability.automationName=UiAutomator2
# Android 15 emulator (AVD Pixel_API_35)
capability.platformVersion=15
capability.deviceName=emulator-5554
# Google Calculator, not in the repository (see README)
capability.app=resources/apps/calculator.apk
capability.newCommandTimeout=300
