# iOS session, read by DriverFactory.getIosInstance()
# Same format as android.properties (see the notes there): appium.server.url plus one
# capability.<name> line per capability; any key can be overridden with -D<key>=<value>.
#
# Needs a Mac with Xcode and the Appium XCUITest driver:
#   appium driver install xcuitest
# Not run yet (no Mac available so far); see resources/suites/CalculatorTestSuite-iOS.xml
# for the full how-to.

appium.server.url=http://127.0.0.1:4723

capability.platformName=iOS
capability.automationName=XCUITest

# --- Simulator (default) ---
# xcrun simctl list devices   shows the installed simulators and their iOS versions;
# deviceName and platformVersion must match one of them.
capability.platformVersion=18.0
capability.deviceName=iPhone 16
# Simulator build of the app (.app folder), relative to the project folder
capability.app=resources/apps/app-under-test.app

# --- Real iPhone (instead of the simulator) ---
# Use the device build (.ipa) and add the device id and the signing team, which
# Appium needs to install WebDriverAgent on the phone:
# capability.app=resources/apps/app-under-test.ipa
# capability.udid=<device id from: xcrun xctrace list devices>
# capability.xcodeOrgId=<Apple developer team id>
# capability.xcodeSigningId=Apple Development

# --- App already installed? Start it by bundle id instead of capability.app ---
# capability.bundleId=com.example.calculator

capability.newCommandTimeout=300
# Dismisses iOS system alerts (e.g. permission prompts) automatically
capability.autoDismissAlerts=true
